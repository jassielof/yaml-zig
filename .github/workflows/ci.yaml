name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Zig
        uses: jassielof/setup-zig@main

      - name: Check
        run: zig build check --summary all
  build:
    name: Build
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Zig
        uses: jassielof/setup-zig@main

      - name: Build
        run: zig build --summary all

      - name: Docs
        run: zig build docs --summary all

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/docs
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-slim
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Zig
        uses: jassielof/setup-zig@main

      - name: Test
        run: zig build test --summary all -Dsummary=true

      - name: Render YAML spec coverage summary
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: zig build coverage-summary

  pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    if: github.event_name != 'pull_request'
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
